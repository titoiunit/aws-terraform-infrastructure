name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Format and validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize canonical configuration without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false -no-color

      - name: Validate canonical configuration
        working-directory: terraform
        run: terraform validate -no-color

      - name: Initialize dev configuration without backend
        working-directory: environments/dev
        run: terraform init -backend=false -input=false -no-color

      - name: Validate dev configuration
        working-directory: environments/dev
        run: terraform validate -no-color

  docker-checks:
    name: Build and health-check container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg APP_ENV=ci -t aws-terraform-infrastructure:ci .

      - name: Start container
        run: docker run --detach --name portfolio-app --publish 8080:8080 aws-terraform-infrastructure:ci

      - name: Verify health endpoint
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs portfolio-app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force portfolio-app
